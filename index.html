<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <header class="border-b border-slate-800 bg-slate-950 sticky top-0 z-40">
    <div class="max-w-[1600px] mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-500 rounded-lg flex items-center justify-center text-white font-black">
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <h1 class="text-lg font-black text-white">OPERATIONS DASHBOARD</h1>
      </div>
      <a href="admin.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs uppercase">
        Admin Portal <i class="fa-solid fa-lock ml-1"></i>
      </a>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto px-6 mt-6 space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700">
        <p class="text-slate-400 text-xs font-bold uppercase">Total Cases</p>
        <p id="pubTotal" class="text-3xl font-black text-white mt-2">0</p>
      </div>
      <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700">
        <p class="text-slate-400 text-xs font-bold uppercase">Issued</p>
        <p id="pubIssued" class="text-3xl font-black text-emerald-400 mt-2">0</p>
      </div>
      <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700">
        <p class="text-slate-400 text-xs font-bold uppercase">Pending</p>
        <p id="pubPending" class="text-3xl font-black text-amber-400 mt-2">0</p>
      </div>
    </div>

    <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700">
      <h3 class="text-sm font-bold text-slate-300 uppercase mb-4">Overall Distribution</h3>
      <div class="h-[250px] flex justify-center">
        <canvas id="pubChart"></canvas>
      </div>
    </div>
  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwB47spxqfKviGFA-NSeH2D_dRAweRjctVyQ5T5GIPMFQm2adKzOWlL8NSkPWlHgrD2/exec";
    let chartInstance = null;

    async function fetchPublicData() {
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        const rows = data.rows || [];

        let total = rows.length;
        let issued = 0, pending = 0;

        rows.forEach(r => {
          const rem = (r.remark || "").toLowerCase();
          if (rem.includes("issued") || rem.includes("approved") || rem.includes("completed")) issued++;
          else pending++;
        });

        document.getElementById("pubTotal").innerText = total;
        document.getElementById("pubIssued").innerText = issued;
        document.getElementById("pubPending").innerText = pending;

        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById("pubChart").getContext("2d");
        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Issued', 'Pending'],
            datasets: [{ data: [issued, pending], backgroundColor: ['#10b981', '#f59e0b'], borderWidth: 0 }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      } catch (e) {
        console.error("Data Load Error:", e);
      }
    }

    window.onload = fetchPublicData;
  </script>
</body>
</html>
