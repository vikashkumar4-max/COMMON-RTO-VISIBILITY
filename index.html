<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAN INDIA LIVE DASHBOARD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    
    .kpi-card {
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
    }
    .kpi-card.active-kpi {
      outline: 3px solid #38bdf8;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .top-bar-stripe {
      height: 4px;
      background: linear-gradient(90deg, #f97316 0%, #10b981 50%, #06b6d4 100%);
    }

    .table-container::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-container::-webkit-scrollbar-track { background: #f1f1f1; }
    .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen text-slate-800 pb-10">

  <!-- TOP STRIPE -->
  <div class="top-bar-stripe"></div>

  <!-- HEADER -->
  <header class="max-w-[1500px] mx-auto px-4 pt-4 pb-2">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 px-6 py-3 flex flex-wrap justify-between items-center gap-4">
      
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 bg-slate-900 rounded-lg flex items-center justify-center text-amber-400 font-black text-xl shadow">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="flex items-center gap-3">
          <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">PAN INDIA LIVE DASHBOARD</h1>
          <span id="syncStatus" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200">
            <span class="w-2 h-2 mr-1.5 rounded-full bg-amber-500 animate-ping"></span>
            Syncing Data...
          </span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span class="bg-slate-100 text-slate-700 font-semibold px-4 py-1.5 rounded-lg text-xs border border-slate-200">
          User: <strong class="text-slate-900">Administrator</strong>
        </span>
        <button onclick="location.reload()" class="bg-red-500 hover:bg-red-600 text-white font-bold px-4 py-1.5 rounded-lg text-xs transition shadow-sm uppercase">
          LOGOUT
        </button>
      </div>

    </div>
  </header>

  <main class="max-w-[1500px] mx-auto px-4 mt-3 space-y-4">

    <!-- KPI CARDS SECTION -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      
      <!-- TOTAL CASES -->
      <div id="card-total" onclick="selectKpiFilter('TOTAL')" class="kpi-card active-kpi bg-[#0f172a] text-white p-5 rounded-xl border border-slate-800 shadow">
        <p class="text-[11px] font-extrabold uppercase tracking-wider text-slate-300">TOTAL CASES</p>
        <p id="kpiTotal" class="text-4xl font-black mt-2">0</p>
      </div>

      <!-- CERTIFICATE ISSUED -->
      <div id="card-issued" onclick="selectKpiFilter('ISSUED')" class="kpi-card bg-[#064e3b] text-white p-5 rounded-xl border border-emerald-900 shadow">
        <p class="text-[11px] font-extrabold uppercase tracking-wider text-emerald-200">CERTIFICATE ISSUED</p>
        <p id="kpiIssued" class="text-4xl font-black mt-2">0</p>
      </div>

      <!-- PENDING CASES -->
      <div id="card-pending" onclick="selectKpiFilter('PENDING')" class="kpi-card bg-[#451a03] text-white p-5 rounded-xl border border-amber-900 shadow">
        <p class="text-[11px] font-extrabold uppercase tracking-wider text-amber-200">PENDING CASES</p>
        <p id="kpiPending" class="text-4xl font-black mt-2">0</p>
      </div>

      <!-- NEED ACTION / ALERT -->
      <div id="card-action" onclick="selectKpiFilter('ACTION')" class="kpi-card bg-[#4c0519] text-white p-5 rounded-xl border border-rose-950 shadow">
        <p class="text-[11px] font-extrabold uppercase tracking-wider text-rose-200">NEED ACTION / ALERT</p>
        <p id="kpiAction" class="text-4xl font-black mt-2">0</p>
      </div>

    </div>

    <!-- FILTER & SEARCH PANEL -->
    <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
        
        <!-- FILTER BY STATE -->
        <div class="md:col-span-3">
          <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-wider mb-1">FILTER BY STATE</label>
          <select id="stateFilter" onchange="applyFilters()" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-slate-800">
            <option value="ALL">All States</option>
          </select>
        </div>

        <!-- FILTER BY STATUS -->
        <div class="md:col-span-3">
          <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-wider mb-1">FILTER BY STATUS</label>
          <select id="remarkFilter" onchange="applyFilters()" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-slate-800">
            <option value="ALL">All Status / Remarks</option>
          </select>
        </div>

        <!-- QUICK SEARCH (VEHICLE & OWNER NAME) -->
        <div class="md:col-span-3">
          <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-wider mb-1">QUICK SEARCH</label>
          <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Search Vehicle Number or Owner Name..." class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-slate-800">
        </div>

        <!-- DATE & TODAY FILTER -->
        <div class="md:col-span-3">
          <div class="flex justify-between items-center mb-1">
            <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-wider">DATE FILTER</label>
            <button onclick="setTodayDate()" class="text-[10px] font-black text-amber-600 hover:text-amber-800 uppercase">TODAY</button>
          </div>
          <div class="flex gap-2">
            <input type="date" id="dateFilter" onchange="applyFilters()" class="w-full bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-slate-800">
            <button onclick="clearDate()" class="px-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-lg border border-slate-300 transition">Clear</button>
          </div>
        </div>

      </div>
    </div>

    <!-- MAIN DATA TABLE -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="table-container overflow-x-auto max-h-[620px]">
        <table class="w-full text-left border-collapse">
          <thead class="bg-[#0f172a] text-white text-[11px] font-extrabold uppercase tracking-wider sticky top-0 z-10">
            <tr>
              <th class="px-4 py-3.5 border-b border-slate-800">SR. NO.</th>
              <th class="px-4 py-3.5 border-b border-slate-800">VEHICLE NUMBER</th>
              <th class="px-4 py-3.5 border-b border-slate-800">REMARK / STATUS</th>
              <th class="px-4 py-3.5 border-b border-slate-800">DATE</th>
              <th class="px-4 py-3.5 border-b border-slate-800">OWNER NAME</th>
              <th class="px-4 py-3.5 border-b border-slate-800">MOBILE NUMBER</th>
              <th class="px-4 py-3.5 border-b border-slate-800">TIMESTAMP</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-200 text-xs font-semibold text-slate-800">
            <!-- Data Rows Render Here -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    // ⚠️ YAHAN APNA APPS SCRIPT WEB APP URL PASTE KAREIN
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw59kPHIVUQ9hc0B6Fh0qFBGAQsQLLUWXsnYS91brq8XHj10rv6tA4CaiK1MNkzWHJr/exec";

    const NEED_ACTION_CONDITIONS = [
      "top-up done", "top-up pending", "check not clear", 
      "only activation pending", "tagging pending", "tagging done", "inventory"
    ];

    let fullDataset = [];
    let selectedKpi = "TOTAL";

    window.onload = function() {
      fetchData(true);
      // SILENT BACKGROUND FETCH EVERY 10 SECONDS
      setInterval(() => { fetchData(false); }, 10000);
    };

    async function fetchData(isInitial = false) {
      const syncStatus = document.getElementById("syncStatus");
      if (isInitial && syncStatus) syncStatus.style.opacity = "1";

      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        
        fullDataset = data.rows || [];

        populateSelect("stateFilter", data.states || [], "All States");
        populateSelect("remarkFilter", data.remarks || [], "All Status / Remarks");

        applyFilters();

        if (syncStatus) {
          syncStatus.innerHTML = `<span class="w-2 h-2 mr-1.5 rounded-full bg-emerald-500"></span>Live Updated`;
          syncStatus.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200";
        }

      } catch (err) {
        console.error("Silent Fetch Error:", err);
      }
    }

    function populateSelect(id, items, defaultText) {
      const select = document.getElementById(id);
      const currentVal = select.value;
      
      select.innerHTML = `<option value="ALL">${defaultText}</option>`;
      items.forEach(item => {
        if (!item) return;
        const opt = document.createElement("option");
        opt.value = item;
        opt.innerText = item;
        select.appendChild(opt);
      });
      select.value = currentVal || "ALL";
    }

    function selectKpiFilter(type) {
      selectedKpi = type;
      
      document.querySelectorAll('.kpi-card').forEach(c => c.classList.remove('active-kpi'));
      
      if (type === 'TOTAL') document.getElementById('card-total').classList.add('active-kpi');
      if (type === 'ISSUED') document.getElementById('card-issued').classList.add('active-kpi');
      if (type === 'PENDING') document.getElementById('card-pending').classList.add('active-kpi');
      if (type === 'ACTION') document.getElementById('card-action').classList.add('active-kpi');

      applyFilters();
    }

    function applyFilters() {
      const stateVal = document.getElementById("stateFilter").value;
      const remarkVal = document.getElementById("remarkFilter").value;
      const dateVal = document.getElementById("dateFilter").value;
      const searchVal = document.getElementById("searchInput").value.toLowerCase().trim().replace(/\s+/g, '');

      // Filter Data
      let filtered = fullDataset.filter(item => {
        const matchesState = (stateVal === "ALL" || item.state === stateVal);
        const matchesRemark = (remarkVal === "ALL" || item.remark === remarkVal);
        
        // Flexible Date Matching
        let matchesDate = true;
        if (dateVal) {
          matchesDate = item.date && item.date.includes(dateVal);
        }
        
        // Search Vehicle Number or Owner Name
        const vehClean = (item.vehicle || "").toLowerCase().replace(/\s+/g, '');
        const ownClean = (item.owner || "").toLowerCase().replace(/\s+/g, '');
        const matchesSearch = (!searchVal || vehClean.includes(searchVal) || ownClean.includes(searchVal));

        return matchesState && matchesRemark && matchesDate && matchesSearch;
      });

      // Update Cards Count
      updateKpiCounters(filtered);

      // Apply Card Filter
      if (selectedKpi !== "TOTAL") {
        filtered = filtered.filter(item => {
          const remLower = (item.remark || "").toLowerCase().trim();
          const isAction = NEED_ACTION_CONDITIONS.some(cond => remLower.includes(cond));
          const isIssued = remLower.includes("issued") || remLower.includes("approved") || remLower.includes("passed") || remLower.includes("completed");

          if (selectedKpi === "ACTION") return isAction;
          if (selectedKpi === "ISSUED") return !isAction && isIssued;
          if (selectedKpi === "PENDING") return !isAction && !isIssued;
          return true;
        });
      }

      renderTable(filtered);
    }

    function updateKpiCounters(data) {
      let total = data.length;
      let issued = 0;
      let pending = 0;
      let actionNeeded = 0;

      data.forEach(row => {
        const rem = (row.remark || "").toLowerCase().trim();
        const isAction = NEED_ACTION_CONDITIONS.some(cond => rem.includes(cond));
        const isIssued = rem.includes("issued") || rem.includes("approved") || rem.includes("passed") || rem.includes("completed");

        if (isAction) {
          actionNeeded++;
        } else if (isIssued) {
          issued++;
        } else {
          pending++;
        }
      });

      document.getElementById("kpiTotal").innerText = total;
      document.getElementById("kpiIssued").innerText = issued;
      document.getElementById("kpiPending").innerText = pending;
      document.getElementById("kpiAction").innerText = actionNeeded;
    }

    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400 font-bold">No records found matching criteria</td></tr>`;
        return;
      }

      const fragment = document.createDocumentFragment();
      data.forEach((row, idx) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition border-b border-slate-200";

        let statusClass = "bg-amber-100 text-amber-900 border-amber-300";
        const remLower = (row.remark || "").toLowerCase();
        
        if (NEED_ACTION_CONDITIONS.some(c => remLower.includes(c))) {
          statusClass = "bg-rose-100 text-rose-900 border-rose-300";
        } else if (remLower.includes("issued") || remLower.includes("approved") || remLower.includes("passed")) {
          statusClass = "bg-emerald-100 text-emerald-900 border-emerald-300";
        }

        tr.innerHTML = `
          <td class="px-4 py-3 font-bold text-slate-500">${idx + 1}</td>
          <td class="px-4 py-3 font-black text-slate-900">${row.vehicle || '-'}</td>
          <td class="px-4 py-3">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded text-[11px] font-bold border ${statusClass}">
              ${row.remark || '-'}
            </span>
          </td>
          <td class="px-4 py-3 font-bold text-slate-700">${row.date || '-'}</td>
          <td class="px-4 py-3 font-medium text-slate-800">${row.owner || '-'}</td>
          <td class="px-4 py-3 font-mono text-slate-600">${row.mobile || '-'}</td>
          <td class="px-4 py-3 font-mono text-slate-500 text-[11px]">${row.timestamp || '-'}</td>
        `;
        fragment.appendChild(tr);
      });
      tbody.appendChild(fragment);
    }

    // FIXED LOCAL TIMEZONE TODAY FUNCTION
    function setTodayDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      document.getElementById("dateFilter").value = `${year}-${month}-${day}`;
      applyFilters();
    }

    function clearDate() {
      document.getElementById("dateFilter").value = "";
      applyFilters();
    }
  </script>
</body>
</html>
