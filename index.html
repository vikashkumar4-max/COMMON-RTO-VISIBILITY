<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pan India Certification Tracking Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
    
    /* Code protection: Disable text selection */
    body { 
      font-family: 'Roboto', sans-serif; 
      user-select: none; 
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }
    .mono-font { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

  <!-- Top Bar -->
  <div class="bg-slate-900 text-slate-300 text-[11px] px-6 py-1.5 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center gap-3 font-medium">
      <span><i class="fa-solid fa-shield-halved text-amber-500 mr-1"></i> Official Management Portal</span>
      <span>|</span>
      <span>India</span>
    </div>
    <div id="liveTime" class="font-mono text-slate-400">--:--:--</div>
  </div>

  <!-- Header -->
  <header class="bg-white border-b border-slate-300 shadow-sm sticky top-0 z-40">
    <div class="max-w-[1700px] mx-auto px-6 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-indigo-900 text-white rounded-md flex items-center justify-center font-black text-2xl shadow">
          <i class="fa-solid fa-building-columns"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900 uppercase">PAN INDIA CERTIFICATION SYSTEM</h1>
          <p class="text-xs text-slate-500 font-semibold">USER OPERATIONS DASHBOARD</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-[1700px] mx-auto px-6 mt-6">

    <div id="loadingBox" class="bg-white p-12 rounded border border-slate-300 shadow-sm text-center">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-900"></i>
      <p class="text-xs font-bold text-slate-600 mt-3 uppercase tracking-wider">Fetching live data feed...</p>
    </div>

    <div id="teamViewSection" class="space-y-4 hidden">
      
      <!-- Filters -->
      <div class="bg-white p-4 rounded border border-slate-300 shadow-sm flex flex-wrap gap-3 items-center justify-between">
        <div class="flex flex-wrap gap-3 items-center flex-1">
          <div class="relative min-w-[260px]">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
            <input type="text" id="searchInput" oninput="debounceFilter()" placeholder="Search Vehicle, Owner, Device..." class="w-full bg-slate-50 border border-slate-300 text-xs font-bold pl-9 pr-3 py-2.5 rounded focus:outline-none focus:border-indigo-900">
          </div>

          <select id="stateFilter" onchange="applyFilters()" class="bg-slate-50 border border-slate-300 text-xs font-bold py-2.5 px-3 rounded focus:outline-none focus:border-indigo-900">
            <option value="">All States / Projects</option>
          </select>

          <select id="remarkFilter" onchange="applyFilters()" class="bg-slate-50 border border-slate-300 text-xs font-bold py-2.5 px-3 rounded focus:outline-none focus:border-indigo-900">
            <option value="">All Status / Remarks</option>
          </select>

          <input type="date" id="dateFilter" onchange="applyFilters()" class="bg-slate-50 border border-slate-300 text-xs font-bold py-2 px-3 rounded focus:outline-none focus:border-indigo-900">

          <button onclick="resetFilters()" class="px-3 py-2.5 bg-slate-200 text-slate-700 text-xs font-bold rounded hover:bg-slate-300">
            Reset
          </button>
        </div>

        <div class="text-xs font-bold text-slate-600">
          Total Records: <span id="recordCount" class="text-indigo-900 font-black">0</span>
        </div>
      </div>

      <!-- User Dashboard Data Table -->
      <div class="bg-white rounded border border-slate-300 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-800 text-white text-[11px] font-bold uppercase tracking-wider border-b border-slate-700">
                <th class="px-4 py-3 text-center w-12 border-r border-slate-700">#</th>
                <th class="px-4 py-3 border-r border-slate-700">Vehicle Registration</th>
                <th class="px-4 py-3 border-r border-slate-700">Device Name</th>
                <th class="px-4 py-3 border-r border-slate-700">Owner / Operator</th>
                <th class="px-4 py-3 border-r border-slate-700">State / Project</th>
                <th class="px-4 py-3 border-r border-slate-700">Order Date</th>
                <th class="px-4 py-3">Status / Remark</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-200 text-xs">
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <script>
    // ⚠️ APNI NEW GOOGLE APPS SCRIPT KA DEPLOYED URL YAHAN PASTE KAREIN
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtZNbTVadyUQvyWvN9RMnaE8LMMFUpwYn_7dXG2r0wOQqy2--wXYIVCZFeLL5pHVOn/exec";

    const NEED_ACTION_CONDITIONS = [
      "top-up done", "top-up pending", "check not clear", 
      "only activation pending", "tagging pending", "tagging done", "inventory"
    ];

    let fullRows = [];
    let filteredRows = [];
    let debounceTimer = null;

    window.onload = function() {
      updateClock();
      setInterval(updateClock, 1000);
      loadData();
    };

    function updateClock() {
      const now = new Date();
      document.getElementById("liveTime").innerText = now.toLocaleTimeString('en-IN', { hour12: false });
    }

    async function loadData() {
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();

        fullRows = data.rows || [];

        populateDropdown("stateFilter", data.states || []);
        populateDropdown("remarkFilter", data.remarks || []);

        document.getElementById("loadingBox").classList.add("hidden");
        document.getElementById("teamViewSection").classList.remove("hidden");

        applyFilters();
      } catch (err) {
        console.error("Data Load Error:", err);
        document.getElementById("loadingBox").innerHTML = `
          <p class="text-xs font-bold text-rose-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Data loading failed. Please re-check Apps Script URL.</p>
        `;
      }
    }

    function populateDropdown(id, list) {
      const select = document.getElementById(id);
      list.forEach(item => {
        if (!item) return;
        const opt = document.createElement("option");
        opt.value = item;
        opt.innerText = item;
        select.appendChild(opt);
      });
    }

    function debounceFilter() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(applyFilters, 200);
    }

    function applyFilters() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const state = document.getElementById("stateFilter").value;
      const remark = document.getElementById("remarkFilter").value;
      const date = document.getElementById("dateFilter").value;

      filteredRows = fullRows.filter(r => {
        if (q) {
          const matchVeh = (r.vehicle || "").toLowerCase().includes(q);
          const matchOwn = (r.owner || "").toLowerCase().includes(q);
          const matchDev = (r.deviceName || "").toLowerCase().includes(q);
          if (!matchVeh && !matchOwn && !matchDev) return false;
        }
        if (state && r.state !== state) return false;
        if (remark && r.remark !== remark) return false;
        if (date && r.date !== date) return false;
        return true;
      });

      renderTable(filteredRows);
    }

    function renderTable(rows) {
      const tbody = document.getElementById("tableBody");
      document.getElementById("recordCount").innerText = rows.length;

      if (!rows || rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400 font-medium">No matching vehicle records found.</td></tr>`;
        return;
      }

      let html = "";
      rows.forEach((r, idx) => {
        const bgClass = idx % 2 === 0 ? "bg-white" : "bg-slate-50";
        
        let statusBadge = "bg-slate-200 text-slate-800 border-slate-300";
        const remLower = (r.remark || "").toLowerCase();
        if (remLower.includes("issued") || remLower.includes("passed") || remLower.includes("completed")) {
          statusBadge = "bg-emerald-100 text-emerald-800 border-emerald-300";
        } else if (NEED_ACTION_CONDITIONS.some(c => remLower.includes(c))) {
          statusBadge = "bg-rose-100 text-rose-800 border-rose-300";
        } else if (remLower.includes("pending")) {
          statusBadge = "bg-amber-100 text-amber-800 border-amber-300";
        }

        html += `
          <tr class="${bgClass} hover:bg-indigo-50/50 transition border-b border-slate-200">
            <td class="px-4 py-2.5 text-center font-mono text-slate-500 border-r border-slate-200">${idx + 1}</td>
            <td class="px-4 py-2.5 mono-font font-medium text-slate-900 border-r border-slate-200 tracking-wider">${r.vehicle || '-'}</td>
            <td class="px-4 py-2.5 font-medium text-slate-700 border-r border-slate-200">${r.deviceName || '-'}</td>
            <td class="px-4 py-2.5 font-medium text-slate-800 border-r border-slate-200">${r.owner || '-'}</td>
            <td class="px-4 py-2.5 font-semibold text-slate-600 border-r border-slate-200">${r.state || 'General'}</td>
            <td class="px-4 py-2.5 font-mono text-slate-600 border-r border-slate-200">${r.date || '-'}</td>
            <td class="px-4 py-2.5">
              <span class="inline-block px-2.5 py-0.5 rounded text-[11px] font-bold border ${statusBadge}">${r.remark || 'Pending'}</span>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    function resetFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("stateFilter").value = "";
      document.getElementById("remarkFilter").value = "";
      document.getElementById("dateFilter").value = "";
      applyFilters();
    }

    // --- DATA PRIVACY & CODE PROTECTION SCRIPTS ---
    // 1. Right Click Block
    document.addEventListener('contextmenu', event => event.preventDefault());

    // 2. Ctrl+U, F12, DevTools Shortcuts Block
    document.onkeydown = function(e) {
      if (e.keyCode == 123) { return false; } // F12 Key
      if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'i'.charCodeAt(0))) { return false; } // Ctrl+Shift+I
      if (e.ctrlKey && e.shiftKey && (e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'c'.charCodeAt(0))) { return false; } // Ctrl+Shift+C
      if (e.ctrlKey && e.shiftKey && (e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'j'.charCodeAt(0))) { return false; } // Ctrl+Shift+J
      if (e.ctrlKey && (e.keyCode == 'U'.charCodeAt(0) || e.keyCode == 'u'.charCodeAt(0))) { return false; } // Ctrl+U (View Source)
      if (e.ctrlKey && (e.keyCode == 'S'.charCodeAt(0) || e.keyCode == 's'.charCodeAt(0))) { return false; } // Ctrl+S (Save Webpage)
    };
  </script>
</body>
</html>
